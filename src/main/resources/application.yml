  ## freemarker设置视图的配置
  freemarker:
    #freemarker页面的后缀，默认的是 .ftlh
    suffix: .ftl
    #响应类型，默认就是以下
    content-type: text/html
    charset: UTF-8
    #freemarker页面存放的目录，默认的是templates
    template-loader-path: classpath:/views/
    request-context-attribute: ctx
    settings:
      number_format: 0.##

  #修改默认的静态寻址资源目录，多个路径之间用逗号隔开
  resources:
    static-locations: classpath:/public/,classpath:/static/


# Mybatis-plus配置
mybatis-plus:
  #配置Mapper映射文件
  mapper-locations: classpath*:/mapper/**/*Mapper.xml
  # 配置MyBatis数据返回类型别名（默认别名是类名）
  #type-aliases-package: com.simatelex.admin.pojo
  configuration:
    # 自动驼峰命名，将实体类中驼峰命名的变量自动转换成_
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 禁用二级缓存
    #cache-enabled: false
    # 关闭懒加载、完整加载结果集
    lazy-loading-enabled: false
    aggressive-lazy-loading: false
    use-column-label: true

# SQL 打印(方法接口所在的包，不是Mapper.xml所在的包)
logging:
  group:
    mygroup: com.simatelex.admin.mappers
  level:
    root: info
    mygroup: debug
#    org.apache.ibatis: warn
    # 避免控制台刷屏：每个 mapper.xml 的 “Parsed mapper file” 等解析过程日志
#    org.apache.ibatis.builder.xml: warn
#    org.mybatis.spring.SqlSessionFactoryBean: warn
#    com.simatelex.admin.mappers: debug
  ## 控制台日志输出格式
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} === [%thread] %-5level %logger{50} - %msg%n'
    rolling-file-name: /logs/spring-boot.%d{yyyy-MM-dd}.%i.log
    dateformat: yyyy-MM-dd HH:mm:ss
  file:
    max-size: 20MB
    name: logs/email_send.log
  config:
    classpath:logback-spring.xml
