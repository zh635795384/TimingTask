## 3.大小写敏感
## 4.缩进时不允许使用Tab键，只允许使用空格
## 5.松散表示，java中对于驼峰命名法，可用原名或使用-代替驼峰，如java中的lastName属性，在yml中使用lastName或last-name都可正确映射
